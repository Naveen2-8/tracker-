<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest Ledger — Cauliflower Business Tracker</title>
    <meta name="description" content="Professional cauliflower harvest business tracker for managing land purchases, daily sales, customer analytics, and profit tracking.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- jsPDF + AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ================================================================
           RESET & TOKENS
        ================================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* Soft Cream / Earthy Beige Backgrounds */
            --cream-50: #fefdfa;
            --cream-100: #fcfaf5;
            --cream-200: #f6f3ea;
            --cream-300: #e8e3d3;
            
            /* Rich Natural Greens */
            --green-50: #edf4ed;
            --green-100: #d4e4d4;
            --green-200: #abc9ac;
            --green-300: #7eb380;
            --green-400: #599c5c;
            --green-500: #428245;
            --green-600: #336736;
            --green-700: #29522b;
            --green-800: #224224;
            --green-900: #1d361f;

            /* Grays for Text */
            --gray-400: #9aa393;
            --gray-500: #727d6c;
            --gray-600: #555e50;
            --gray-700: #3b4137;
            --gray-800: #272b24;
            --gray-900: #151813;

            --red-500: #d04646;
            --red-50: #fdf1f1;

            --font-display: 'Outfit', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;

            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
            --shadow-lg: 0 16px 40px rgba(0,0,0,0.2);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;

            --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-body);
            color: var(--gray-800);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            background-image: url('hero.png.jpeg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            margin: 0;
        }

        /* Semi-transparent dark overlay so background photo shows through elegantly */
        .app-overlay {
            min-height: 100vh;
            padding-bottom: 72px;
            background: rgba(0, 0, 0, 0.45);
        }

        h1, h2, h3, h4 {
            font-family: var(--font-display);
            line-height: 1.25;
            color: var(--gray-900);
        }

        /* ================================================================
           LAYOUT
        ================================================================ */
        .app {
            max-width: 720px;
            margin: 0 auto;
        }

        .header {
            padding: 40px 16px 24px;
            text-align: center;
            color: white;
        }

        .header-eyebrow {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--green-200);
            margin-bottom: 6px;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        .section {
            padding: 0 16px;
            margin-bottom: 24px;
        }

        /* ================================================================
           CARDS
        ================================================================ */
        .card {
            background: #ffffff; /* Pure white for maximum readability over the dark overlay */
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.22), 0 4px 16px rgba(0,0,0,0.12);
            border: 1px solid rgba(255, 255, 255, 0.95);
            transition: all 0.3s ease;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-label {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        /* ================================================================
           INVESTMENT + STATS
        ================================================================ */
        .invest-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--gray-600);
            margin-bottom: 6px;
        }

        .invest-wrap {
            position: relative;
        }

        .invest-wrap .rupee {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gray-500);
            pointer-events: none;
        }

        .invest-wrap input {
            width: 100%;
            padding: 14px 14px 14px 32px;
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gray-900);
            background: var(--white);
            border: 2px solid var(--cream-300);
            border-radius: var(--radius-md);
            transition: all 0.2s var(--ease);
        }

        .invest-wrap input:focus {
            outline: none;
            border-color: var(--green-500);
            box-shadow: 0 0 0 4px rgba(66,130,69,0.12);
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .stat-tile {
            padding: 16px;
            border-radius: var(--radius-md);
            background: var(--white);
            border: 1px solid var(--cream-300);
        }

        .stat-tile.positive { background: var(--green-50); border-color: var(--green-200); }
        .stat-tile.negative { background: var(--red-50); border-color: #f7d5d5; }

        .stat-tile-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--gray-600);
            margin-bottom: 4px;
        }

        .stat-tile-value {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--gray-900);
        }

        .stat-tile.positive .stat-tile-value { color: var(--green-700); }
        .stat-tile.negative .stat-tile-value { color: var(--red-500); }

        /* ================================================================
           CUSTOMER GRID
        ================================================================ */
        .customer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }
        /* Custom scrollbar for grid */
        .customer-grid::-webkit-scrollbar { width: 6px; }
        .customer-grid::-webkit-scrollbar-thumb { background-color: var(--green-300); border-radius: 4px; }

        .cust-card {
            background: var(--white);
            border: 2px solid var(--cream-300);
            border-radius: var(--radius-md);
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
        }

        .cust-card:hover {
            border-color: var(--green-400);
            background: var(--green-50);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }

        .cust-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--green-600);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .cust-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.2;
            word-break: break-word;
        }

        .cust-phone {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .empty-customers {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 10px;
            color: var(--gray-500);
            font-size: 0.9rem;
            background: var(--white);
            border: 1px dashed var(--cream-300);
            border-radius: var(--radius-md);
        }

        /* ================================================================
           MODALS
        ================================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s var(--ease);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #ffffff;
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 420px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            transform: translateY(20px) scale(0.95);
            transition: transform 0.25s var(--ease);
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--gray-900);
        }

        /* ================================================================
           FORM
        ================================================================ */
        .form-grid { display: grid; gap: 16px; }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-600);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            color: var(--gray-900);
            background: var(--white);
            border: 2px solid var(--cream-300);
            border-radius: var(--radius-md);
            transition: all 0.2s var(--ease);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--green-500);
            box-shadow: 0 0 0 4px rgba(66,130,69,0.12);
        }

        .live-total-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: var(--green-50);
            border: 2px solid var(--green-100);
            border-radius: var(--radius-md);
        }

        .live-total-bar.highlight {
            background: var(--green-100);
            border-color: var(--green-300);
        }

        .live-label {
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--green-700);
        }

        .live-value {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--green-800);
        }

        /* ================================================================
           BUTTONS
        ================================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            white-space: nowrap;
        }

        .btn:active { transform: scale(0.97); }

        .btn-green {
            background: var(--green-600);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(51,103,54,0.3);
        }

        .btn-green:hover {
            background: var(--green-500);
            box-shadow: 0 6px 16px rgba(51,103,54,0.4);
            transform: translateY(-1px);
        }

        .btn-light {
            background: var(--cream-300);
            color: var(--gray-800);
        }

        .btn-light:hover { background: #ded8c6; }

        .btn-block {
            width: 100%;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .export-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .export-row .btn { flex: 1; }

        /* ================================================================
           SEARCH & LEDGER TABLE
        ================================================================ */
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box .s-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .search-box .s-icon svg {
            width: 17px;
            height: 17px;
            stroke: var(--gray-500);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .search-box input {
            width: 100%;
            padding: 13px 16px 13px 46px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            background: var(--white);
            border: 2px solid var(--cream-300);
            border-radius: var(--radius-md);
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--green-500);
        }

        .table-scroll {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--cream-300);
            background: var(--white);
        }

        .ledger-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 540px;
        }

        .ledger-table thead { background: var(--green-800); }

        .ledger-table th {
            padding: 12px 14px;
            text-align: left;
            color: var(--white);
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .ledger-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--cream-200);
            color: var(--gray-800);
        }

        .ledger-table tbody tr:hover { background: var(--green-50); }
        .ledger-table tbody tr:last-child td { border-bottom: none; }

        .ledger-table .cell-name { font-weight: 700; color: var(--gray-900); }
        .ledger-table .cell-total { font-family: var(--font-display); font-weight: 700; color: var(--green-700); }
        .ledger-table .cell-actions { text-align: center; width: 44px; }

        .del-btn {
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
            color: var(--gray-400);
            border-radius: 6px;
            transition: all 0.15s;
            font-size: 1rem;
            line-height: 1;
        }

        .del-btn:hover { color: var(--red-500); background: var(--red-50); }

        .table-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4px 4px;
            font-size: 0.85rem;
            color: var(--gray-600);
        }

        .table-summary-total {
            font-family: var(--font-display);
            font-weight: 800;
            color: var(--gray-900);
            font-size: 1rem;
        }

        /* ================================================================
           EMPTY STATE
        ================================================================ */
        .empty {
            text-align: center;
            padding: 40px 20px;
        }
        .empty h4 { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
        .empty p { font-size: 0.9rem; color: var(--gray-500); }

        /* ================================================================
           TOAST
        ================================================================ */
        .toast-wrap {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
        }

        .toast {
            background: var(--gray-900);
            color: var(--white);
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.3s var(--ease), toastOut 0.3s var(--ease) 2.4s forwards;
            white-space: nowrap;
        }

        @keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px) scale(0.95); } }

        /* ================================================================
           RESPONSIVE
        ================================================================ */
        /* ── Mobile-first responsive ── */
        @media (max-width: 600px) {
            .header { padding: 28px 16px 18px; }
            .header-title { font-size: 1.55rem; }
            .header-eyebrow { font-size: 0.7rem; }
            .section { padding: 0 10px; margin-bottom: 16px; }
            .card { padding: 18px 14px; border-radius: var(--radius-md); }

            /* Customers: compact 2-column grid on mobile */
            .customer-grid {
                grid-template-columns: repeat(2, 1fr);
                max-height: 360px;
                gap: 10px;
                padding-right: 2px;
            }
            .cust-card { min-height: 88px; padding: 12px 8px; }
            .cust-name { font-size: 0.85rem; }

            /* Sales Ledger table: horizontal scroll */
            .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .ledger-table { min-width: 480px; font-size: 0.8rem; }
            .ledger-table td, .ledger-table th { padding: 10px 10px; }

            /* Modals */
            .modal-box { padding: 22px 16px; border-radius: var(--radius-lg); max-width: 100%; }
            .form-row-2 { grid-template-columns: 1fr; gap: 12px; }
            .export-row { flex-direction: column; }
            .btn-block { padding: 14px; }
        }
        @media (max-width: 360px) {
            .customer-grid { grid-template-columns: 1fr; }
            .header-title { font-size: 1.35rem; }
        }

        /* ================================================================
           COMPLETE JOB BUTTON (on badge)
        ================================================================ */
        .cust-complete-btn {
            margin-top: 8px;
            padding: 5px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: var(--font-body);
            background: var(--green-50);
            color: var(--green-700);
            border: 1.5px solid var(--green-300);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
            line-height: 1;
        }
        .cust-complete-btn:hover {
            background: var(--green-600);
            color: #fff;
            border-color: var(--green-600);
            transform: scale(1.04);
        }

        /* ================================================================
           COMPLETED JOBS ARCHIVE
        ================================================================ */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .archive-card {
            background: #f0f4f0;
            border: 2px dashed var(--green-300);
            border-radius: var(--radius-md);
            padding: 14px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
            opacity: 0.85;
        }
        .archive-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--green-300);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }
        .archive-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--gray-700);
            word-break: break-word;
        }
        .archive-badge {
            margin-top: 5px;
            font-size: 0.68rem;
            font-weight: 600;
            background: var(--green-100);
            color: var(--green-700);
            padding: 2px 8px;
            border-radius: 10px;
        }
        .archive-section-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .archive-count {
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--green-200);
            color: var(--green-800);
            padding: 2px 8px;
            border-radius: 10px;
        }
        @media (max-width: 600px) {
            .archive-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .archive-card { min-height: 78px; padding: 10px 7px; }
        }
    </style>
</head>
<body>

<div class="app-overlay">
    <div class="app">

        <!-- ========== HEADER ========== -->
        <header class="header">
            <div class="header-eyebrow">Harvest Ledger</div>
            <h1 class="header-title">Cauliflower Tracker</h1>
        </header>



        <!-- ========== CUSTOMERS GRID ========== -->
        <section class="section">
            <div class="card">
                <div class="card-head" style="flex-wrap: wrap; gap: 8px;">
                    <h2 class="card-label">Active Customers</h2>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <button id="openArchiveBtn" class="btn btn-light" style="font-size:0.85rem; padding:10px 16px; position:relative;">📂 View Data Archive <span id="archiveCountBadge" style="display:none; margin-left:4px; background:var(--green-600); color:#fff; font-size:0.68rem; font-weight:700; padding:1px 7px; border-radius:10px;">0</span></button>
                        <button id="openAddCustomerBtn" class="btn btn-green">+ Add Customer</button>
                    </div>
                </div>
                <div class="customer-grid" id="customerGrid">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </section>

        <!-- ========== LEDGER ========== -->
        <section class="section">
            <div class="card">
                <div class="card-head">
                    <h2 class="card-label">Sales Ledger</h2>
                </div>
                <div class="search-box">
                    <span class="s-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                    <input type="text" id="searchInput" placeholder="Search by customer name or date...">
                </div>
                <div id="ledgerBox"></div>
                <div id="exportBox" style="display:none; margin-top: 16px;">
                    <button class="btn btn-block btn-green" id="btnOpenPdfModal">Download PDF</button>
                </div>
            </div>
        </section>

    </div>
</div>

<!-- ========== MODALS ========== -->

<!-- Archive Modal -->
<div class="modal-overlay" id="archiveModal">
    <div class="modal-box" style="max-width: 640px; max-height: 88vh; overflow-y: auto;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
            <h2 class="modal-title" style="margin-bottom:0;">Completed Jobs <span id="archiveCount" style="font-size:0.8rem; font-weight:600; background:var(--green-100); color:var(--green-700); padding:2px 10px; border-radius:10px; margin-left:8px;">0</span></h2>
            <button id="closeArchiveModalBtn" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--gray-500); line-height:1; padding:4px 8px;">&times;</button>

        <div id="archiveGrid" class="archive-grid">
            <!-- Rendered via JS -->

        <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">

            <button id="btnResetLedger" class="btn btn-block" style="background:none; color:#c0392b; border:2px solid #c0392b; font-weight:700; font-size:0.9rem;">Reset Ledger / Clear All Data</button>

        <form id="entryForm">
            <div class="form-grid">
                <div class="form-group">

                        <label for="numBags">Number of Bags</label>
                        <input type="number" id="numBags" min="1" step="1" placeholder="0" required>
                    </div>

                        <label for="rateBag">Rate per Bag (Rs)</label>
                        <input type="number" id="rateBag" min="0" step="0.01" placeholder="0" required>
                    </div>
                </div>
                <div class="live-total-bar" id="liveBar">
                    <span class="live-label">Line Total</span>
                    <span class="live-value" id="liveVal">Rs 0</span>
                </div>
                <div class="form-row-2" style="margin-top: 8px;">
                    <button type="button" class="btn" style="background:#25D366; color:white; padding: 14px 8px; font-size: 0.9rem;" id="btnCompleteWhatsapp">Complete Job (WA)</button>
                    <button type="submit" class="btn btn-green">Save Entry</button>

<div class="modal-overlay" id="pdfModal">
    <div class="modal-box">
        <h2 class="modal-title">Select Date Range for PDF</h2>
        <div class="form-grid">
            <button type="button" class="btn btn-light btn-block" id="btnPdf1Week">Last 1 Week</button>
            <button type="button" class="btn btn-light btn-block" id="btnPdf1Month">Last 1 Month</button>
            <div style="margin: 12px 0; text-align: center; color: var(--gray-500); font-size: 0.8rem; font-weight: 600;">OR CUSTOM RANGE</div>
            <div class="form-row-2">
                <div class="form-group">
                    <label>From Date</label>
                    <input type="date" id="exportFrom">
                </div>
                <div class="form-group">
                    <label>To Date</label>
                    <input type="date" id="exportTo">
                </div>

                <button type="button" class="btn btn-light" id="closePdfModalBtn">Cancel</button>
                <button type="button" class="btn btn-green" id="btnGenerateCustomPdf">Generate PDF</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
(function () {
    'use strict';

    // --- SUPABASE INITIALIZATION ---
    // Note: Replace these with your actual Supabase project URL and anon key from your dashboard
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    // Check if the developer replaced the placeholders before initializing to prevent errors
    let supabase = null;
    if (SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log("Supabase client initialized successfully.");
    } else {
        console.warn("Supabase client NOT initialized. Please enter your URL and Anon Key.");
    }

    /* ───── State Management (localStorage) ───── */
    var STORE = 'harvest_ledger_v4';

    function load() {
        try { var r = localStorage.getItem(STORE); return r ? JSON.parse(r) : { investment: 0, entries: [], customers: [] }; }
        catch (e) { return { investment: 0, entries: [], customers: [] }; }
    }

    function save() {
        try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {}
    }

    var S = load();
    
    // Migration: ensure customers is an array of objects
    if (!Array.isArray(S.customers)) S.customers = [];
    S.customers = S.customers.map(function(c) {
        return typeof c === 'string' ? { id: uid(), name: c, phone: '', investment: 0 } : c;
    });

    /* ───── Helpers ───── */
    function fmtNum(n) {
        if (n == null) return '0';
        return Math.abs(n).toLocaleString('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 0 });
    }

    function fmtRs(n) {
        if (n == null) return 'Rs 0';
        return (n < 0 ? '-Rs ' : 'Rs ') + fmtNum(n);
    }

    function plainNum(n) {
        if (n == null) return '0';
        var s = String(n).replace(/[^0-9.\-]/g, '');
        var num = parseFloat(s);
        return isNaN(num) ? '0' : fmtNum(num);
    }

    function fmtDate(d) {
        return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function esc(s) { var e = document.createElement('span'); e.textContent = s; return e.innerHTML; }

    function toast(msg) {
        var c = document.getElementById('toastWrap');
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(function () { if (t.parentNode) t.remove(); }, 2900);
    }

    function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function getInitials(name) { return name.split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase() || 'C'; }

    /* ───── DOM Elements ───── */
    
    var customerGrid       = document.getElementById('customerGrid');
    var openAddCustomerBtn = document.getElementById('openAddCustomerBtn');
    
    // Modals
    var addCustomerModal   = document.getElementById('addCustomerModal');
    var addCustomerForm    = document.getElementById('addCustomerForm');
    var newCustName        = document.getElementById('newCustName');
    var newCustPhone       = document.getElementById('newCustPhone');
    var newCustInvest      = document.getElementById('newCustInvest');
    var cancelAddCustomerBtn = document.getElementById('cancelAddCustomerBtn');

    var entryModal         = document.getElementById('entryModal');
    var entryForm          = document.getElementById('entryForm');
    var entryModalTitle    = document.getElementById('entryModalTitle');
    var entryDate          = document.getElementById('entryDate');
    var numBags            = document.getElementById('numBags');
    var rateBag            = document.getElementById('rateBag');
    var liveBar            = document.getElementById('liveBar');
    var liveVal            = document.getElementById('liveVal');
    var btnCompleteWhatsapp = document.getElementById('btnCompleteWhatsapp');

    var searchInput   = document.getElementById('searchInput');
    var ledgerBox     = document.getElementById('ledgerBox');
    var exportBox     = document.getElementById('exportBox');
    var btnOpenPdfModal = document.getElementById('btnOpenPdfModal');
    
    // PDF Modal elements
    var pdfModal = document.getElementById('pdfModal');
    var closePdfModalBtn = document.getElementById('closePdfModalBtn');
    var btnPdf1Week = document.getElementById('btnPdf1Week');
    var btnPdf1Month = document.getElementById('btnPdf1Month');
    var btnGenerateCustomPdf = document.getElementById('btnGenerateCustomPdf');
    var exportFrom = document.getElementById('exportFrom');
    var exportTo = document.getElementById('exportTo');

    var currentActiveCustomer = null;

    function totalEarned() { return S.entries.reduce(function (s, e) { return s + e.bags * e.rate; }, 0); }

    /* ───── Customer Grid ───── */
    function renderGrid() {
        var active = S.customers.filter(function(c) { return !c.completed; }).slice().reverse();

        if (active.length === 0) {
            customerGrid.innerHTML = '<div class="empty-customers">No active customers. Click "+ Add Customer" to begin.</div>';
        } else {
            var html = '';
            active.forEach(function (c) {
                var inv = (c.investment && c.investment > 0)
                    ? '<div style="font-size:0.72rem;color:var(--green-700);margin-top:5px;font-weight:600;">Inv: Rs ' + plainNum(c.investment) + '</div>'
                    : '';
                html += '<div class="cust-card" data-id="' + c.id + '">'
                      + '<div class="cust-avatar">' + esc(getInitials(c.name)) + '</div>'
                      + '<div class="cust-name">' + esc(c.name) + '</div>'
                      + (c.phone ? '<div class="cust-phone">' + esc(c.phone) + '</div>' : '')
                      + inv
                      + '<button class="cust-complete-btn" data-cid="' + c.id + '">&#10003; Complete Job</button>'
                      + '</div>';
            });
            customerGrid.innerHTML = html;

            customerGrid.querySelectorAll('.cust-card').forEach(function(card) {
                card.addEventListener('click', function() {
                    var cust = S.customers.find(function(c) { return c.id === card.dataset.id; });
                    if (cust) openEntryModal(cust);
                });
            });

            customerGrid.querySelectorAll('.cust-complete-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation(); // don't open entry modal
                    var cid = btn.dataset.cid;
                    var cust = S.customers.find(function(c) { return c.id === cid; });
                    if (!cust) return;
                    if (!confirm('Mark "' + cust.name + '" as Complete? They will move to the Completed Jobs Archive.')) return;
                    cust.completed = true;
                    save();
                    renderGrid();
                    renderCompleted();
                    toast('"' + cust.name + '" moved to Completed Jobs.');
                });
            });
        }

        renderCompleted();
    }

    /* ───── Completed Jobs Archive ───── */
    var openArchiveBtn       = document.getElementById('openArchiveBtn');
    var archiveModal         = document.getElementById('archiveModal');
    var archiveCountBadge    = document.getElementById('archiveCountBadge');

    function openArchiveModal() {
        renderCompleted();
        archiveModal.classList.add('active');
    }
    function closeArchiveModal() {
        archiveModal.classList.remove('active');
    }
    if (openArchiveBtn) openArchiveBtn.addEventListener('click', openArchiveModal);
    document.getElementById('closeArchiveModalBtn').addEventListener('click', closeArchiveModal);
    document.getElementById('closeArchiveModalBtn2').addEventListener('click', closeArchiveModal);
    archiveModal.addEventListener('mousedown', function(e) { if (e.target === archiveModal) closeArchiveModal(); });

    /* ───── Reset / Clear All Data ───── */
    document.getElementById('btnResetLedger').addEventListener('click', function() {
        if (!confirm('Are you sure you want to delete ALL active customers, completed jobs, and ledger entries?\n\nThis action CANNOT be undone.')) return;
        if (!confirm('Second confirmation: This will permanently wipe everything and reset to a blank slate. Continue?')) return;
        S.customers = [];
        S.entries   = [];
        save();
        closeArchiveModal();
        renderGrid();
        renderLedger();
        renderCompleted();
        toast('All data has been cleared. Fresh start!');
    });

    function renderCompleted() {
        var done = S.customers.filter(function(c) { return c.completed; });
        var archiveGrid  = document.getElementById('archiveGrid');
        var archiveCount = document.getElementById('archiveCount');

        // Update the header badge on the View Archive button
        if (archiveCountBadge) {
            if (done.length > 0) {
                archiveCountBadge.textContent = done.length;
                archiveCountBadge.style.display = '';
            } else {
                archiveCountBadge.style.display = 'none';
            }
        }
        if (archiveCount) archiveCount.textContent = done.length;

        if (done.length === 0) {
            archiveGrid.innerHTML = '<div style="text-align:center; padding:30px; color:var(--gray-500); font-size:0.9rem;">No completed jobs yet.</div>';
            return;
        }

        var html = '';
        done.slice().reverse().forEach(function(c) {
            var earned = S.entries.filter(function(e) { return e.customerId === c.id; })
                                  .reduce(function(sum, e) { return sum + e.bags * e.rate; }, 0);
            var profit = earned - (c.investment || 0);
            html += '<div class="archive-card">'
                  + '<div class="archive-avatar">' + esc(getInitials(c.name)) + '</div>'
                  + '<div class="archive-name">' + esc(c.name) + '</div>'
                  + '<div class="archive-badge">Earned: Rs ' + plainNum(earned) + '</div>'
                  + (c.investment ? '<div style="font-size:0.65rem;color:var(--gray-500);margin-top:3px;">Profit: Rs ' + plainNum(profit) + '</div>' : '')
                  + '</div>';
        });
        archiveGrid.innerHTML = html;
    }

    /* ───── Add Customer Modal ───── */
    openAddCustomerBtn.addEventListener('click', function() {
        newCustName.value = '';
        newCustPhone.value = '';
        if(newCustInvest) newCustInvest.value = '';
        addCustomerModal.classList.add('active');
        setTimeout(function(){ newCustName.focus(); }, 100);
    });

    function closeAddCustomerModal() {
        addCustomerModal.classList.remove('active');
    }
    cancelAddCustomerBtn.addEventListener('click', closeAddCustomerModal);
    addCustomerModal.addEventListener('mousedown', function(e) { if(e.target === addCustomerModal) closeAddCustomerModal(); });

    addCustomerForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var rawName = newCustName.value.trim();
        var name = rawName.replace(/\w\S*/g, function(txt){ return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase(); });
        var invStr = newCustInvest.value.trim();
        
        if (!name || invStr === '') {
            toast('Name and Investment are required.');
            return;
        }
        
        var inv = parseFloat(invStr) || 0;
        var newCust = { id: uid(), name: name, phone: newCustPhone.value.trim(), investment: inv };
        S.customers.push(newCust);
        save();
        renderGrid();
        closeAddCustomerModal();
        toast('Customer "' + name + '" added successfully.');
        openEntryModal(newCust); // Jump straight to entry!
    });

    /* ───── Entry Modal ───── */
    function openEntryModal(cust) {
        currentActiveCustomer = cust;
        entryModalTitle.textContent = 'Entry: ' + cust.name;
        
        // Setup defaults
        entryDate.value = todayStr();
        numBags.value = '';
        rateBag.value = '';
        calcLive();

        entryModal.classList.add('active');
        setTimeout(function(){ numBags.focus(); }, 100);
    }

    function closeEntryModal() {
        entryModal.classList.remove('active');
        currentActiveCustomer = null;
    }

    entryModal.addEventListener('mousedown', function(e) { if(e.target === entryModal) closeEntryModal(); });

    if (btnCompleteWhatsapp) {
        btnCompleteWhatsapp.addEventListener('click', function() {
            if (!currentActiveCustomer) return;
            if (confirm('Mark this customer as Complete and send summary to WhatsApp?')) {
                var c = currentActiveCustomer;
                c.completed = true;
                save();
                renderGrid();
                renderCompleted();

                var custEntries = S.entries.filter(function(e) { return e.customerId === c.id; });
                var earned = 0;
                var totalBags = 0;
                var entryBreakdown = "";
                
                custEntries.forEach(function(e) {
                    earned += (e.bags * e.rate);
                    totalBags += (parseFloat(e.bags) || 0);
                    
                    var ed = e.date ? new Date(e.date) : new Date();
                    var eday = ("0" + ed.getDate()).slice(-2);
                    var emonth = ("0" + (ed.getMonth() + 1)).slice(-2);
                    var ey = ed.getFullYear();
                    entryBreakdown += "[" + eday + "-" + emonth + "-" + ey + "]: " + e.bags + " Bags\n";
                });
                
                var inv = parseFloat(c.investment) || 0;
                var diff = earned - inv;
                var profit = diff > 0 ? diff : 0;
                var loss = diff < 0 ? Math.abs(diff) : 0;

                var message = "✅ JOB COMPLETED: " + c.name + "\n" +
                              "---------------------------\n" +
                              "📅 ENTRY BREAKDOWN:\n" +
                              entryBreakdown +
                              "---------------------------\n" +
                              "📊 SUMMARY:\n" +
                              "Total Bags: " + totalBags + "\n" +
                              "Investment: Rs " + plainNum(inv) + "\n" +
                              "Profit: Rs " + plainNum(profit) + "\n" +
                              "Loss: Rs " + plainNum(loss) + "\n" +
                              "---------------------------\n" +
                              "Final Total: Rs " + plainNum(earned);
                
                console.log("Preparing to send text message to Supabase Edge Function...");

                if (supabase) {
                    const payload = {
                        phone: "7604865472",
                        message: message
                    };

                    supabase.functions.invoke('send-whatsapp', {
                        body: payload
                    }).then(function(response) {
                        if (response.error) {
                            console.error("Supabase Edge Function Error:", response.error);
                            toast("Error sending message via Supabase.");
                        } else {
                            console.log("Supabase Edge Function Success:", response.data);
                            toast('"' + c.name + '" marked as complete & text sent!');
                        }
                    }).catch(function(err) {
                        console.error("Network or invocation error:", err);
                    });
                } else {
                    console.log("Supabase not configured. Falling back to manual WhatsApp open.");
                    var waUrl = "https://wa.me/917604865472?text=" + encodeURIComponent(message);
                    window.open(waUrl, '_blank');
                    toast('"' + c.name + '" marked as complete (Fallback Mode).');
                }

                closeEntryModal();
            }
        });
    }

    function calcLive() {
        var b = parseFloat(numBags.value) || 0;
        var r = parseFloat(rateBag.value) || 0;
        var t = b * r;
        liveVal.textContent = fmtRs(t);
        liveBar.classList.toggle('highlight', t > 0);
    }

    numBags.addEventListener('input', calcLive);
    rateBag.addEventListener('input', calcLive);

    entryForm.addEventListener('submit', function(e) {
        e.preventDefault();
        if (!currentActiveCustomer) return;

        var bags = parseFloat(numBags.value) || 0;
        var rate = parseFloat(rateBag.value) || 0;
        var date = entryDate.value;

        if (bags <= 0 || rate <= 0 || !date) {
            toast('Please enter valid bags and rate.');
            return;
        }

        S.entries.push({
            id: uid(),
            customerId: currentActiveCustomer.id,
            name: currentActiveCustomer.name,
            phone: currentActiveCustomer.phone,
            date: date,
            bags: bags,
            rate: rate
        });
        save();
        
        // --- Task 2: New SMS Trigger for "Save Entry" ---
        var ed = date ? new Date(date) : new Date();
        var eday = ("0" + ed.getDate()).slice(-2);
        var emonth = ("0" + (ed.getMonth() + 1)).slice(-2);
        var ey = ed.getFullYear();
        var savedDateFmt = eday + "-" + emonth + "-" + ey;
        
        var entryMessage = "🆕 NEW ENTRY SAVED:\n" +
                           "Customer: " + currentActiveCustomer.name + "\n" +
                           "Date: [" + savedDateFmt + "]\n" +
                           "Added: " + bags + " Bags";

        if (supabase) {
            supabase.functions.invoke('send-whatsapp', {
                body: { phone: "7604865472", message: entryMessage }
            }).catch(function(err) {
                console.error("Save Entry SMS error:", err);
            });
        }

        numBags.value = '';
        rateBag.value = '';
        calcLive();
        
        renderLedger();
        closeEntryModal();
        toast('Saved entry for ' + currentActiveCustomer.name + '.');
    });

    /* ───── Search & Ledger ───── */
    searchInput.addEventListener('input', renderLedger);

    function getFiltered() {
        var q = searchInput.value.trim().toLowerCase();
        var list = S.entries.slice();
        if (q) {
            list = list.filter(function (e) {
                return e.name.toLowerCase().indexOf(q) !== -1
                    || fmtDate(e.date).toLowerCase().indexOf(q) !== -1
                    || e.date.indexOf(q) !== -1;
            });
        }
        list.sort(function (a, b) { var c = b.date.localeCompare(a.date); return c !== 0 ? c : (b.id > a.id ? 1 : -1); });
        return list;
    }

    function renderLedger() {
        var entries = getFiltered();

        if (S.entries.length === 0) {
            ledgerBox.innerHTML = '<div class="empty"><h4>No entries yet</h4><p>Add a customer and save an entry above.</p></div>';
            exportBox.style.display = 'none';
            return;
        }

        if (entries.length === 0) {
            ledgerBox.innerHTML = '<div class="empty"><h4>No results found</h4><p>Try a different search term.</p></div>';
            exportBox.style.display = 'none';
            return;
        }

        var runTotal = 0;
        var html = '<div class="table-scroll"><table class="ledger-table">'
            + '<thead><tr><th>Date</th><th>Customer</th><th>Bags</th><th>Rate</th><th>Total</th><th></th></tr></thead><tbody>';

        entries.forEach(function (e) {
            var t = e.bags * e.rate;
            runTotal += t;
            html += '<tr>'
                + '<td>' + fmtDate(e.date) + '</td>'
                + '<td class="cell-name">' + esc(e.name) + '</td>'
                + '<td>' + e.bags + '</td>'
                + '<td>' + plainNum(e.rate) + '</td>'
                + '<td class="cell-total">' + plainNum(t) + '</td>'
                + '<td class="cell-actions"><button class="del-btn" data-id="' + e.id + '">&times;</button></td>'
                + '</tr>';
        });

        html += '</tbody></table></div>';
        html += '<div class="table-summary"><span>' + entries.length + ' entr' + (entries.length === 1 ? 'y' : 'ies') + '</span>'
              + '<span class="table-summary-total">Rs ' + plainNum(runTotal) + '</span></div>';

        ledgerBox.innerHTML = html;
        exportBox.style.display = 'block';

        ledgerBox.querySelectorAll('.del-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (confirm('Are you sure you want to delete this entry?')) {
                    S.entries = S.entries.filter(function (e) { return e.id !== btn.dataset.id; });
                    save();
                    renderLedger();
                    toast('Entry removed.');
                }
            });
        });
    }

    /* ───── PDF Export Modal ───── */
    function openPdfModal() {
        pdfModal.classList.add('active');
    }
    function closePdfModal() {
        pdfModal.classList.remove('active');
    }
    if (btnOpenPdfModal) btnOpenPdfModal.addEventListener('click', openPdfModal);
    if (closePdfModalBtn) closePdfModalBtn.addEventListener('click', closePdfModal);
    if (pdfModal) pdfModal.addEventListener('mousedown', function(e) { if(e.target === pdfModal) closePdfModal(); });

    function generatePdf(daysBack) {
        var entries = getFiltered();
        
        var fromVal = '';
        var toVal = '';
        
        if (daysBack === 'custom') {
            fromVal = exportFrom.value;
            toVal = exportTo.value;
        } else if (daysBack) {
            var d = new Date();
            toVal = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            d.setDate(d.getDate() - daysBack);
            fromVal = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        
        if (fromVal) entries = entries.filter(function(e) { return e.date >= fromVal; });
        if (toVal) entries = entries.filter(function(e) { return e.date <= toVal; });
        
        if (entries.length === 0) { toast('No data to export for this date range.'); return; }

        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF();

        var uniqueNames = [];
        entries.forEach(function(e) { if(uniqueNames.indexOf(e.name) === -1) uniqueNames.push(e.name); });
        var titleStr = uniqueNames.length === 1 ? 'Customer Statement - ' + uniqueNames[0] : 'Sales Ledger';

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.setTextColor(41, 82, 43); // Green theme color
        doc.text(titleStr, 14, 18);

        var periodStr = 'Period: ';
        if (fromVal && toVal) periodStr += fmtDate(fromVal) + ' to ' + fmtDate(toVal);
        else if (fromVal) periodStr += 'From ' + fmtDate(fromVal);
        else if (toVal) periodStr += 'Until ' + fmtDate(toVal);
        else periodStr += 'All Records';

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(90, 90, 90);
        doc.text(periodStr, 14, 25);

        var earned = entries.reduce(function(sum, e) { return sum + e.bags * e.rate; }, 0);

        doc.setFontSize(9);
        doc.text(
            'Total Earned: Rs ' + plainNum(earned),
            14, 32
        );

        doc.setDrawColor(200);
        doc.line(14, 35, 196, 35);

        var rows = entries.map(function (e) {
            return [
                fmtDate(e.date),
                e.name,
                String(e.bags),
                plainNum(e.rate),
                plainNum(e.bags * e.rate)
            ];
        });

        doc.autoTable({
            startY: 40,
            head: [['Date', 'Customer', 'Bags', 'Rate', 'Total']],
            body: rows,
            theme: 'grid',
            headStyles: { fillColor: [41, 82, 43], textColor: 255, fontStyle: 'bold', fontSize: 9, font: 'helvetica' },
            styles: { fontSize: 8.5, cellPadding: 5, lineColor: [210, 210, 210], lineWidth: 0.25, font: 'helvetica' },
            alternateRowStyles: { fillColor: [247, 248, 246] },
            columnStyles: { 4: { fontStyle: 'bold', textColor: [40, 92, 40] } }
        });

        var fileName = uniqueNames.length === 1 ? uniqueNames[0].replace(/\s+/g, '_') : 'Ledger';
        doc.save(fileName + '_Statement_' + todayStr() + '.pdf');
        toast('PDF downloaded.');
        closePdfModal();
    }

    if (btnPdf1Week) btnPdf1Week.addEventListener('click', function() { generatePdf(7); });
    if (btnPdf1Month) btnPdf1Month.addEventListener('click', function() { generatePdf(30); });
    if (btnGenerateCustomPdf) btnGenerateCustomPdf.addEventListener('click', function() { generatePdf('custom'); });

    /* ───── Boot ───── */
    renderGrid();
    renderLedger();

})();
</script>

</body>
</html>
